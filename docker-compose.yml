services:
  postgres:
    image: postgres:17-alpine
    container_name: campus_byte_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campus_byte}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-campus_byte}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campus_byte_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_byte_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Campus Byte API"
      API_VERSION: "v1"
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-campus_byte}
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
    networks:
      - campus_byte_network

volumes:
  postgres_data:
    driver: local

networks:
  campus_byte_network:
    driver: bridge

